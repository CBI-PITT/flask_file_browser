{% if brainpi_enabled %}
const brainPiBaseUrl = {{ brainpi_base_url | tojson }};

function configureBrainPiButton(button, itemName, pathLookupUrl, supportedSuffixes) {
    button.classList.add('d-none');
    button.classList.remove('disabled');
    button.removeAttribute('href');
    button.removeAttribute('aria-disabled');
    button.dataset.pathLookupUrl = pathLookupUrl || '';

    const normalizedName = String(itemName || '').toLowerCase();
    if (!pathLookupUrl || !supportedSuffixes.some(suffix => normalizedName.endsWith(suffix))) {
        return;
    }

    button.classList.remove('d-none');
    button.classList.add('disabled');
    button.setAttribute('aria-disabled', 'true');

    fetch(pathLookupUrl)
        .then(response => {
            if (!response.ok) throw new Error(`Path lookup failed with status ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (!data.file_path) throw new Error("File path missing");
            if (button.dataset.pathLookupUrl !== pathLookupUrl) return;

            button.setAttribute(
                'href',
                brainPiBaseUrl + '/path_to_html_options/?path=' + encodeURIComponent(data.file_path)
            );
            button.classList.remove('disabled');
            button.removeAttribute('aria-disabled');
        })
        .catch(error => {
            if (button.dataset.pathLookupUrl !== pathLookupUrl) return;
            button.classList.add('d-none');
            button.classList.remove('disabled');
            button.removeAttribute('aria-disabled');
            console.error("Failed to build BrAinPI link:", error);
        });
}

brainModalEl.addEventListener('show.bs.modal', function (event) {
  var bdata = event.relatedTarget.dataset;
  var fdata = JSON.parse(event.relatedTarget.dataset.fdata);

  event.target.querySelector('#brainModalLabel').innerHTML = fdata.files_name;
  event.target.querySelector('#brainModalUpdated').innerHTML = fdata.files_modtime;
  event.target.querySelector('#brainModalFileSize').innerHTML = fdata.files_size[0] + ' ' + fdata.files_size[1];

  var dl_btn = event.target.querySelector('#brainModalFileSlug')

  if (fdata.files_dl)
  {
    dl_btn.setAttribute('href',fdata.files_dl);
    dl_btn.classList.remove('d-none');
  }
  else{
    dl_btn.setAttribute('href',fdata.files_dl);
    dl_btn.classList.add('d-none');
  }

  let dynamicLink = null;
  if (fdata.files)
  {
    const parts = fdata.files.split('/').slice(3);  // Split and remove first 2 elements
    dynamicLink = "/{{ current_path['html_path_split'][0] }}/get_file_path/" + parts.join('/');

    //cppath.dataset.dynamicLink = dynamicLink;
    selpath.dataset.dynamicLink = dynamicLink;
    //cppath.classList.remove('d-none');
  }
  else{
    alert("No path available to copy.");
    //cppath.classList.add('d-none');
  }
  {% if brainpi_enabled %}
  configureBrainPiButton(
      event.target.querySelector('#brainModalBrainPi'),
      fdata.files_name,
      dynamicLink,
      ['.tif', '.tiff', '.ims']
  );
  {% endif %}
})

function getFieldId() {
    return window.frameElement?.dataset?.fieldId || null;
}

document.getElementById("brainModalSelectBtn").addEventListener("click", function () {
    const fieldId = getFieldId();
    const filePath = selpath.dataset.dynamicLink;
    const fileName = document.getElementById("brainModalLabel").textContent;
    const nextBrowserPath = window.location.pathname;

    if (!fieldId || !filePath || !nextBrowserPath) {
        alert("Missing file path or field ID");
        return;
    }

    fetch(selpath.dataset.dynamicLink)
        .then(response => response.json())
        .then(data => {
            if (!data.file_path) throw new Error("File path missing");
            const trueFilePath = data.file_path;

            window.parent.postMessage({
                fieldId: fieldId,
                selectedPath: trueFilePath,
                fileName: fileName,
                nextBrowserPath: nextBrowserPath
            }, "*");

            // Close modal
            const modalEl = bootstrap.Modal.getInstance(document.getElementById("brainModal"));
            if (modalEl) modalEl.hide();
        })
        .catch(error => {
            console.error("Failed:", error);
            alert("Failed to fetch the file path.");
        });
});
