<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
// Modal configuration and table enhancement.
// Element IDs, data-fdata attributes and the postMessage payload are part of
// the contract with fl_browse_table_body.html and the embed picker.

$(document).ready(function() {
    new DataTable("#myTable", {
        searching: true,
        pageLength: 25,
        lengthMenu: [10, 25, 50, 100],
        order: [[0, "asc"]],
        autoWidth: false,
        language: {
            search: "",
            searchPlaceholder: "Search files and folders",
            emptyTable: "This folder is empty",
            zeroRecords: "No matching files or folders",
            info: "Showing _START_ to _END_ of _TOTAL_ entries",
            infoEmpty: "No entries to show",
            infoFiltered: "(filtered from _MAX_ total entries)",
            lengthMenu: "Show _MENU_ entries"
        }
    });
});

{% if brainpi_enabled %}
const brainPiBaseUrl = {{ brainpi_base_url | tojson }};

function configureBrainPiButton(button, itemName, pathLookupUrl, supportedSuffixes) {
    button.classList.add('d-none');
    button.classList.remove('disabled');
    button.removeAttribute('href');
    button.removeAttribute('aria-disabled');
    button.dataset.pathLookupUrl = pathLookupUrl || '';

    const normalizedName = String(itemName || '').toLowerCase();
    if (!pathLookupUrl || !supportedSuffixes.some(suffix => normalizedName.endsWith(suffix))) {
        return;
    }

    button.classList.remove('d-none');
    button.classList.add('disabled');
    button.setAttribute('aria-disabled', 'true');

    fetch(pathLookupUrl)
        .then(response => {
            if (!response.ok) throw new Error(`Path lookup failed with status ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (!data.file_path) throw new Error("File path missing");
            if (button.dataset.pathLookupUrl !== pathLookupUrl) return;

            button.setAttribute(
                'href',
                brainPiBaseUrl + '/path_to_html_options/?path=' + encodeURIComponent(data.file_path)
            );
            button.classList.remove('disabled');
            button.removeAttribute('aria-disabled');
        })
        .catch(error => {
            if (button.dataset.pathLookupUrl !== pathLookupUrl) return;
            button.classList.add('d-none');
            button.classList.remove('disabled');
            button.removeAttribute('aria-disabled');
            console.error("Failed to build BrAinPI link:", error);
        });
}

const neuroglancerBaseUrl = {{ brainpi_neuroglancer_url | tojson }};

// BrAinPI-friendly OME copies written by the PEACE brainreg operation
// (operations/brainreg/write_ng_copies.py); the originals fail in BrAinPI.
const brainregNgRequiredFiles = ['brainreg.json', 'downsampled_ng.tif', 'boundaries_ng.tif'];

function configureBrainregNgButton(button, folderPath, dynamicLink) {
    button.classList.add('d-none');
    button.classList.remove('disabled');
    button.removeAttribute('href');
    button.removeAttribute('aria-disabled');
    button.dataset.dynamicLink = dynamicLink || '';

    // A brainreg output is identified by 'brainreg' anywhere in the folder
    // path; the folder contents are verified against /dir_json/ below.
    const normalizedName = String(folderPath || '').toLowerCase();
    if (!neuroglancerBaseUrl || !dynamicLink || !normalizedName.includes('brainreg')) {
        return;
    }

    button.classList.remove('d-none');
    button.classList.add('disabled');
    button.setAttribute('aria-disabled', 'true');

    fetch(dynamicLink.replace('get_file_path', 'dir_json'))
        .then(response => {
            if (!response.ok) throw new Error(`Directory check failed with status ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (button.dataset.dynamicLink !== dynamicLink) return;
            const names = (data.files_name || []).map(name => String(name).toLowerCase());
            if (!brainregNgRequiredFiles.every(name => names.includes(name))) return;

            return fetch(dynamicLink)
                .then(response => {
                    if (!response.ok) throw new Error(`Path lookup failed with status ${response.status}`);
                    return response.json();
                });
        })
        .then(data => {
            if (!data) return;
            if (button.dataset.dynamicLink !== dynamicLink) return;
            if (!data.file_path) throw new Error("File path missing");

            const folderRealPath = data.file_path.replace(/\/+$/, '');
            return Promise.all(brainregNgRequiredFiles.slice(1).map(name =>
                fetch(brainPiBaseUrl + '/path_to_html_options/?path=' + encodeURIComponent(folderRealPath + '/' + name))
                    .then(response => {
                        if (!response.ok) throw new Error(`BrAinPI lookup failed with status ${response.status}`);
                        return response.json();
                    })
                    .then(options => {
                        if (!options.neuroglancer) throw new Error("No neuroglancer link for " + name);
                        return { name: name, source: 'precomputed://' + options.neuroglancer };
                    })
            )).then(layers => ({ layers: layers }));
        })
        .then(result => {
            if (!result) return;
            if (button.dataset.dynamicLink !== dynamicLink) return;

            // Neuroglancer renders the first layer at the bottom and later
            // layers on top: downsampled_ng.tif under boundaries_ng.tif.
            const state = { layers: [], layout: { type: 'xy' } };
            result.layers.forEach(layer => {
                const ngLayer = { type: 'image', source: layer.source, name: layer.name };
                if (layer.name === 'boundaries_ng.tif') ngLayer.opacity = 0.5;
                state.layers.push(ngLayer);
            });

            button.setAttribute(
                'href',
                neuroglancerBaseUrl + '/#!' + encodeURIComponent(JSON.stringify(state))
            );
            button.classList.remove('disabled');
            button.removeAttribute('aria-disabled');
        })
        .catch(error => {
            if (button.dataset.dynamicLink !== dynamicLink) return;
            button.classList.add('d-none');
            button.classList.remove('disabled');
            button.removeAttribute('aria-disabled');
            console.error("Failed to build Neuroglancer link:", error);
        });
}
{% endif %}

var brainModalEl = document.getElementById('brainModal');
var selpath = document.getElementById('brainModalSelectBtn');

brainModalEl.addEventListener('show.bs.modal', function (event) {
  var fdata = JSON.parse(event.relatedTarget.dataset.fdata);

  event.target.querySelector('#brainModalLabel').innerHTML = fdata.files_name;
  event.target.querySelector('#brainModalUpdated').innerHTML = fdata.files_modtime;
  event.target.querySelector('#brainModalFileSize').innerHTML = fdata.files_size[0] + ' ' + fdata.files_size[1];

  var dl_btn = event.target.querySelector('#brainModalFileSlug')

  if (fdata.files_dl)
  {
    dl_btn.setAttribute('href',fdata.files_dl);
    dl_btn.classList.remove('d-none');
  }
  else{
    dl_btn.setAttribute('href',fdata.files_dl);
    dl_btn.classList.add('d-none');
  }

  let dynamicLink = null;
  if (fdata.files)
  {
    const parts = fdata.files.split('/').slice(3);
    dynamicLink = "/{{ current_path['html_path_split'][0] }}/get_file_path/" + parts.join('/');

    // The modal element exists in both picker and browse contexts; the Select
    // button only exists in picker mode.
    event.target.dataset.dynamicLink = dynamicLink;
    if (selpath) selpath.dataset.dynamicLink = dynamicLink;
  }
  else{
    alert("No path available to copy.");
  }
  {% if brainpi_enabled %}
  configureBrainPiButton(
      event.target.querySelector('#brainModalBrainPi'),
      fdata.files_name,
      dynamicLink,
      ['.tif', '.tiff', '.ims']
  );
  {% endif %}
})

var brainFolderModalEl = document.getElementById('brainFolderModal');
var folderselpath = document.getElementById('brainFolderModalSelectBtn');

brainFolderModalEl.addEventListener('show.bs.modal', function (event) {
  var trigger = event.relatedTarget || event.target;
  var fdata = JSON.parse(trigger.dataset.fdata);
  const parts = fdata.split('/').slice(3);
  event.target.querySelector('#brainFolderModalText').innerHTML = parts[parts.length - 1];
  const dynamicLink = "/{{ current_path['html_path_split'][0] }}/get_file_path/" + parts.join('/');
  if (folderselpath) {
    folderselpath.dataset.dynamicLink = dynamicLink;
    folderselpath.dataset.browserPath = fdata;
  }
  {% if brainpi_enabled %}
  configureBrainPiButton(
      event.target.querySelector('#brainFolderModalBrainPi'),
      parts[parts.length - 1],
      dynamicLink,
      ['.ome.zarr', '.omehans']
  );
  configureBrainregNgButton(
      event.target.querySelector('#brainFolderModalNeuroglancer'),
      fdata,
      dynamicLink
  );
  {% endif %}
});

function getFieldId() {
    return window.frameElement?.dataset?.fieldId || null;
}

// The Select buttons only exist in picker mode (embed page); the full-page
// browser does not render them, so the handlers are attached conditionally.
if (selpath) {
document.getElementById("brainModalSelectBtn").addEventListener("click", function () {
    const fieldId = getFieldId();
    const filePath = selpath.dataset.dynamicLink;
    const fileName = document.getElementById("brainModalLabel").textContent;
    const nextBrowserPath = window.location.pathname;

    if (!fieldId || !filePath || !nextBrowserPath) {
        alert("Missing file path or field ID");
        return;
    }

    fetch(selpath.dataset.dynamicLink)
        .then(response => response.json())
        .then(data => {
            if (!data.file_path) throw new Error("File path missing");
            const trueFilePath = data.file_path;

            window.parent.postMessage({
                fieldId: fieldId,
                selectedPath: trueFilePath,
                fileName: fileName,
                nextBrowserPath: nextBrowserPath
            }, "*");

            // Close modal
            const modalEl = bootstrap.Modal.getInstance(document.getElementById("brainModal"));
            if (modalEl) modalEl.hide();
        })
        .catch(error => {
            console.error("Failed:", error);
            alert("Failed to fetch the file path.");
        });
});
}

if (folderselpath) {
document.getElementById("brainFolderModalSelectBtn").addEventListener("click", function () {
    const fieldId = getFieldId();
    const filePath = folderselpath.dataset.dynamicLink;
    const fileName = document.getElementById("brainFolderModalText").textContent;
    const nextBrowserPath = folderselpath.dataset.browserPath;

    if (!fieldId || !filePath || !nextBrowserPath) {
        alert("Missing file path or field ID");
        return;
    }

    fetch(folderselpath.dataset.dynamicLink)
        .then(response => response.json())
        .then(data => {
            if (!data.file_path) throw new Error("File path missing");
            const trueFilePath = data.file_path;
                window.parent.postMessage({
                    fieldId: fieldId,
                    selectedPath: trueFilePath,
                    fileName: fileName,
                    nextBrowserPath: nextBrowserPath
                }, "*");

            const modalEl = bootstrap.Modal.getInstance(document.getElementById("brainFolderModal"));
            if (modalEl) modalEl.hide();
        })
        .catch(error => {
            console.error("Failed:", error);
            alert("Failed to fetch the file path.");
        });

});
}
</script>
