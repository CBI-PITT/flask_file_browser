{% extends "flask_file_browser/ffbbase.html" %}

{% block ffbcontent %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ messages[0] }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}
        {% endwith %}
        <div class="card ffb-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle ffb-auth-icon" aria-hidden="true"></i>
                    <h1 class="h5 fw-semibold mb-0">Sign in</h1>
                    <p class="text-muted small mb-0">Use your lab account to continue</p>
                </div>
                <form method="POST" action="{{ url_for('flask_file_browser.login_post') }}">
                    <div class="mb-3">
                        <label for="ffb-username" class="form-label small fw-medium">Username</label>
                        <input class="form-control" type="text" id="ffb-username" name="username" placeholder="Lab username" autocomplete="username" autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="ffb-password" class="form-label small fw-medium">Password</label>
                        <input class="form-control" type="password" id="ffb-password" name="password" placeholder="Lab password" autocomplete="current-password">
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="remember" id="ffb-remember">
                        <label class="form-check-label small" for="ffb-remember">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
