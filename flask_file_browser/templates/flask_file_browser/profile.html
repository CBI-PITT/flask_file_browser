{% extends "flask_file_browser/ffbbase.html" %}

{% block ffbcontent %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    {{ messages[0] }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}
        {% endwith %}
        <div class="card ffb-card">
            <div class="card-body p-4 d-flex align-items-center gap-3">
                <i class="bi bi-person-circle ffb-auth-icon" aria-hidden="true"></i>
                <div class="min-w-0">
                    <h1 class="h5 fw-semibold mb-0 text-truncate">Welcome, {{ user.id }}!</h1>
                    <p class="text-muted small mb-0">{{ app_name }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
